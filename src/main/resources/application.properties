# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=sales-service
server.port=${sales.server.port:8082}

# Swagger / OpenAPI (habilitado por defecto; override via sales.api-docs.enabled)
springdoc.api-docs.enabled=${sales.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
# prepareThreshold=0: el pooler de Supabase (pgbouncer en modo transaccion)
# no soporta prepared statements; se configura aca y es sobreescrible
# desde private.properties (db.prepareThreshold).
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase: migraciones propias de este servicio. Los changesets usan
# preconditions con onFail: MARK_RAN, asi que corren aunque el esquema ya
# haya sido creado por ddl-auto=update del common.
spring.liquibase.enabled=${sales.liquibase.enabled:true}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-sales.yaml

# Logs (configurables: rutas y niveles)
sales.log.path=logs
sales.log.file=sales-service.log
sales.log.level.com.bigobooks=INFO
sales.log.level.repositories=DEBUG
sales.log.level.sql=DEBUG
