# cSpell:disable
# Migraciones propias del microservicio de ventas sobre el esquema
# compartido (Libreria-Common). Todos los changesets usan preconditions
# con onFail: MARK_RAN, asi que pueden correr aunque las columnas ya
# hayan sido creadas por ddl-auto=update del common.
databaseChangeLog:
  # orders.user_id: usuario que realizo la venta (cliente)
  - changeSet:
      id: sales-001-orders-user-id
      author: sales-service
      comment: Columna user_id en orders (cliente de la venta)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'user_id'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: user_id
                  type: BIGINT

  # FK orders.user_id -> user_account(id)
  - changeSet:
      id: sales-002-orders-user-fk
      author: sales-service
      comment: FK de orders.user_id hacia user_account
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - tableExists:
            tableName: user_account
        - columnExists:
            tableName: orders
            columnName: user_id
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.table_constraints WHERE table_name = 'orders' AND constraint_name = 'fk_orders_user_account'"
      changes:
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: user_account
            referencedColumnNames: id
            constraintName: fk_orders_user_account
            onDelete: SET NULL
            validate: true

  # book.price: precio de venta en guaranies
  - changeSet:
      id: sales-003-book-price
      author: sales-service
      comment: Columna price en book (precio de venta)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: book
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'book' AND column_name = 'price'"
      changes:
        - addColumn:
            tableName: book
            columns:
              - column:
                  name: price
                  type: BIGINT

  # sales_promotion: entidad propia de este microservicio (simple)
  - changeSet:
      id: sales-004-create-promotion
      author: sales-service
      comment: Tabla propia de promociones (entidad simple del microservicio)
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.tables WHERE table_name = 'sales_promotion'"
      changes:
        - createTable:
            tableName: sales_promotion
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_sales_promotion
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: discount_percent
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false

  # Secuencia implicita que usa Hibernate para sales_promotion
  # (mismo patron que el resto del esquema: <tabla>_seq, incrementBy 50)
  - changeSet:
      id: sales-005-create-promotion-seq
      author: sales-service
      comment: Secuencia de ids de sales_promotion
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.sequences WHERE sequence_name = 'sales_promotion_seq'"
      changes:
        - createSequence:
            sequenceName: sales_promotion_seq
            dataType: bigint
            startValue: 1
            incrementBy: 50
            minValue: 1
            maxValue: 9223372036854775807
            cacheSize: 1
            cycle: false

  # Tabla intermedia Promocion <-> Libro (relacion ManyToMany propia)
  - changeSet:
      id: sales-006-create-promotion-book
      author: sales-service
      comment: Tabla intermedia sales_promotion_book (M2M Promotion-Book)
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.tables WHERE table_name = 'sales_promotion_book'"
      changes:
        - createTable:
            tableName: sales_promotion_book
            columns:
              - column:
                  name: promotion_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: sales_promotion_book
            columnNames: promotion_id, book_id
            constraintName: pk_sales_promotion_book

  - changeSet:
      id: sales-007-fks-promotion-book
      author: sales-service
      comment: FKs de sales_promotion_book hacia sales_promotion y book
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sales_promotion_book
        - tableExists:
            tableName: sales_promotion
        - tableExists:
            tableName: book
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.table_constraints WHERE table_name = 'sales_promotion_book' AND constraint_name = 'fk_spb_promotion'"
      changes:
        - addForeignKeyConstraint:
            baseTableName: sales_promotion_book
            baseColumnNames: promotion_id
            referencedTableName: sales_promotion
            referencedColumnNames: id
            constraintName: fk_spb_promotion
            onDelete: CASCADE
            validate: true
        - addForeignKeyConstraint:
            baseTableName: sales_promotion_book
            baseColumnNames: book_id
            referencedTableName: book
            referencedColumnNames: id
            constraintName: fk_spb_book
            onDelete: CASCADE
            validate: true

  - changeSet:
      id: sales-008-order-number-and-invoice-data
      author: sales-service
      comment: Numero publico de pedido y datos de facturacion del cliente
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_number
                  type: VARCHAR(40)
              - column:
                  name: invoice_business_name
                  type: VARCHAR(255)
              - column:
                  name: invoice_name
                  type: VARCHAR(255)
              - column:
                  name: invoice_last_name
                  type: VARCHAR(255)
        - sql:
            sql: "UPDATE orders SET order_number = 'PED-LEGACY-' || id WHERE order_number IS NULL"
        - addNotNullConstraint:
            tableName: orders
            columnName: order_number
            columnDataType: VARCHAR(40)
        - addUniqueConstraint:
            tableName: orders
            columnNames: order_number
            constraintName: uk_orders_order_number

  - changeSet:
      id: sales-009-order-invoice-ruc
      author: sales-service
      comment: RUC personal del comprador
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'invoice_ruc'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: invoice_ruc
                  type: VARCHAR(20)

  - changeSet:
      id: sales-010-order-invoice-phone
      author: sales-service
      comment: Telefono normalizado del comprador
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'invoice_phone'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: invoice_phone
                  type: VARCHAR(20)

  - changeSet:
      id: sales-011-numero-orden
      author: sales-service
      comment: Numero de orden publico de 8 digitos con backfill unico
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'numero_orden'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: numero_orden
                  type: VARCHAR(8)
        - sql:
            splitStatements: false
            sql: |
              UPDATE orders o
              SET numero_orden = LPAD((10000000 + s.rn)::text, 8, '0')
              FROM (
                SELECT id, ROW_NUMBER() OVER (ORDER BY id) AS rn
                FROM orders
                WHERE numero_orden IS NULL
              ) s
              WHERE o.id = s.id
        - addNotNullConstraint:
            tableName: orders
            columnName: numero_orden
            columnDataType: VARCHAR(8)
        - addUniqueConstraint:
            tableName: orders
            columnNames: numero_orden
            constraintName: uk_orders_numero_orden

  - changeSet:
      id: sales-012-idempotencia-y-cupon
      author: sales-service
      comment: Clave de idempotencia por usuario y snapshot del cupon
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'idempotency_key'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: idempotency_key
                  type: VARCHAR(255)
              - column:
                  name: request_hash
                  type: VARCHAR(64)
              - column:
                  name: coupon_code
                  type: VARCHAR(100)
        - sql:
            splitStatements: false
            sql: |
              UPDATE orders o
              SET coupon_code = c.code
              FROM coupon c
              WHERE o.coupon_id = c.id
                AND o.coupon_code IS NULL
        - addUniqueConstraint:
            tableName: orders
            columnNames: user_id, idempotency_key
            constraintName: uk_orders_user_idempotency

  - changeSet:
      id: sales-013-shipping-snapshot
      author: sales-service
      comment: Snapshot del destinatario separado de la facturacion
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: orders
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'shipping_name'"
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: shipping_name
                  type: VARCHAR(255)
              - column:
                  name: shipping_last_name
                  type: VARCHAR(255)
              - column:
                  name: shipping_department
                  type: VARCHAR(255)
              - column:
                  name: shipping_city
                  type: VARCHAR(255)
              - column:
                  name: shipping_address
                  type: VARCHAR(500)
              - column:
                  name: shipping_reference
                  type: VARCHAR(500)
              - column:
                  name: shipping_phone
                  type: VARCHAR(50)

  - changeSet:
      id: sales-014-order-detail-catalog-snapshot
      author: sales-service
      comment: Portada y autores snapshot del catalogo en el detalle del pedido
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: order_detail
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'order_detail' AND column_name = 'cover_src'"
      changes:
        - addColumn:
            tableName: order_detail
            columns:
              - column:
                  name: cover_src
                  type: VARCHAR(500)
              - column:
                  name: authors
                  type: VARCHAR(500)

  # Cupones: vigencia desde, uso unico por usuario y libros aplicables.
  # Los cupones existentes quedan con valid_from nulo y single_use_per_user
  # en false, por lo que mantienen su comportamiento historico.
  - changeSet:
      id: sales-015-coupon-valid-from
      author: sales-service
      comment: Inicio de vigencia del cupon
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: coupon
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'coupon' AND column_name = 'valid_from'"
      changes:
        - addColumn:
            tableName: coupon
            columns:
              - column:
                  name: valid_from
                  type: TIMESTAMP WITHOUT TIME ZONE

  - changeSet:
      id: sales-016-coupon-single-use
      author: sales-service
      comment: Limite opcional de un uso por usuario
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: coupon
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.columns WHERE table_name = 'coupon' AND column_name = 'single_use_per_user'"
      changes:
        - addColumn:
            tableName: coupon
            columns:
              - column:
                  name: single_use_per_user
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: sales-017-create-coupon-book
      author: sales-service
      comment: Tabla intermedia coupon_book (M2M Coupon-Book)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: coupon
        - tableExists:
            tableName: book
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.tables WHERE table_name = 'coupon_book'"
      changes:
        - createTable:
            tableName: coupon_book
            columns:
              - column:
                  name: coupon_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: coupon_book
            columnNames: coupon_id, book_id
            constraintName: pk_coupon_book

  - changeSet:
      id: sales-018-fks-coupon-book
      author: sales-service
      comment: FKs de coupon_book hacia coupon y book
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: coupon_book
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT count(*) FROM information_schema.table_constraints WHERE table_name = 'coupon_book' AND constraint_name = 'fk_cb_coupon'"
      changes:
        - addForeignKeyConstraint:
            baseTableName: coupon_book
            baseColumnNames: coupon_id
            referencedTableName: coupon
            referencedColumnNames: id
            constraintName: fk_cb_coupon
            onDelete: CASCADE
            validate: true
        - addForeignKeyConstraint:
            baseTableName: coupon_book
            baseColumnNames: book_id
            referencedTableName: book
            referencedColumnNames: id
            constraintName: fk_cb_book
            onDelete: CASCADE
            validate: true
