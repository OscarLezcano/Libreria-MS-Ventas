# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=sales-service
server.port=${sales.server.port:8082}
# Prefijo alineado con la ruta del gateway (/sales/**) y headers del gateway para OpenAPI
server.servlet.context-path=${sales.context-path:/sales}
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico); se puede apagar en local sin servidor
eureka.client.enabled=${sales.eureka.enabled:true}
eureka.client.service-url.defaultZone=${eureka.default-zone:http://localhost:8761/eureka/}

# JSON: no serializar nulos (ej: Envelope.single sin pagination)
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI (habilitado por defecto; override via sales.api-docs.enabled)
springdoc.api-docs.enabled=${sales.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
# prepareThreshold=0: el pooler de Supabase (pgbouncer en modo transaccion)
# no soporta prepared statements; se configura aca y es sobreescrible
# desde private.properties (db.prepareThreshold).
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Cache compartido (Redis). La URL real vive en config/private.properties.
spring.cache.type=redis
spring.data.redis.url=${redis.url}
spring.data.redis.ssl.enabled=${redis.ssl.enabled:true}
spring.data.redis.connect-timeout=${redis.connect-timeout:5s}
spring.data.redis.timeout=${redis.timeout:3s}
sales.cache.key-prefix=bigobooks:v1:sales:
sales.cache.ttl.orders=10m
sales.cache.ttl.coupons=30m
sales.cache.ttl.promotions=15m

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase: migraciones propias de este servicio. Los changesets usan
# preconditions con onFail: MARK_RAN, asi que corren aunque el esquema ya
# haya sido creado por ddl-auto=update del common.
spring.liquibase.enabled=${sales.liquibase.enabled:true}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-sales.yaml

# Seguridad (JWT compartido con el servicio de Auth). Secreto en private.properties.
jwt.secret=${jwt.secret:cambia-este-secreto-de-desarrollo-para-HS512-0123456789abcdef01}
jwt.expiration-minutes=${jwt.expiration-minutes:120}

# Seguridad autorizacion por roles (configurable)
security.jwt.allow-cookie=false
security.public-paths=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
security.roles.orders-view=ADMIN,SELLER,WAREHOUSE,CLIENT
security.roles.orders-create=ADMIN,SELLER,CLIENT
security.roles.orders-manage=ADMIN,SELLER
security.roles.orders-status=ADMIN,SELLER,WAREHOUSE
security.roles.orders-delete=ADMIN
security.roles.coupons-view=ADMIN,SELLER,WAREHOUSE,CLIENT
security.roles.coupons-manage=ADMIN,SELLER
security.roles.coupons-delete=ADMIN
security.roles.promotions-view=ADMIN,SELLER,WAREHOUSE,CLIENT
security.roles.promotions-manage=ADMIN
security.roles.promotions-delete=ADMIN

# Logs (configurables: rutas y niveles)
sales.log.path=logs
sales.log.file=sales-service.log
sales.log.level.com.bigobooks=INFO
sales.log.level.cache=INFO
sales.log.level.security=DEBUG
sales.log.level.repositories=DEBUG
sales.log.level.sql=DEBUG

# Evidencia de propagacion transaccional para la demostracion academica
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
