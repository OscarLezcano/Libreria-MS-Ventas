# cSpell:disable
# Propiedades de test: sombrean a src/main/resources/application.properties.
# El import apunta al .example (no existe private.properties en errores de
# desarrollo) para que los tests de slice no fallen al cargar el contexto.

# Imports
spring.config.import=optional:classpath:config/private.properties.example

# Configuraciones de la aplicacion
spring.application.name=sales-service
server.port=${sales.server.port:8082}

# Swagger / OpenAPI
springdoc.api-docs.enabled=${springdoc.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase deshabilitado en los tests de slice (no hay BD en CI)
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
sales.log.path=logs
sales.log.file=sales-service.log
sales.log.level.com.bigobooks=INFO
sales.log.level.repositories=DEBUG
sales.log.level.sql=DEBUG
