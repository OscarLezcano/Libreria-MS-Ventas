# cSpell:disable

# Imports
spring.config.import=classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=rents-service
server.port=${rents.server.port:8082}

# Swagger / OpenAPI
springdoc.api-docs.enabled=${springdoc.api-docs.enabled:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase deshabilitado: el esquema lo gestiona el common (Libreria-Common)
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
rents.log.path=logs
rents.log.file=rents-service.log
rents.log.level.com.bigobooks=INFO
rents.log.level.repositories=DEBUG
rents.log.level.sql=DEBUG